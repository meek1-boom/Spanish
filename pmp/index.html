<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMP Practice</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08101f;color:#eef3ff}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:#121c33;border:1px solid #293754;border-radius:18px;padding:18px;margin:14px 0}.start{text-align:center;padding:60px 20px}h1{font-size:32px;margin:0 0 10px}h2{margin:4px 0 10px}.muted{color:#9fb0cf;line-height:1.5}.btn,select{border:1px solid #385078;background:#1b2a49;color:#fff;border-radius:12px;padding:12px 14px;font-size:16px}.primary{background:#7257ff;border:0;font-weight:800}.big{font-size:19px;padding:16px 26px;margin-top:14px}.hidden{display:none}.bar{height:7px;background:#24304b;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#7257ff;width:0}.top{position:sticky;top:0;background:#08101fee;backdrop-filter:blur(10px);padding:12px 0;z-index:5}.meta,.controls,.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{font-size:12px;background:#202e4b;padding:6px 9px;border-radius:999px;color:#c7d5ef}.bank{display:grid;gap:9px;margin:14px 0}.tile{background:#21304f;border:1px solid #40547a;border-radius:11px;padding:12px;cursor:pointer}.tile.sel{outline:2px solid #58c8ff}.row{display:grid;grid-template-columns:1fr 1.35fr;gap:9px;margin:9px 0}.label,.drop,.bucket{border-radius:11px;padding:11px;border:1px solid #334563}.label{background:#0e172a;font-weight:700}.drop,.bucket{border-style:dashed;min-height:48px}.bucket{margin:9px 0}.ok{border-color:#36d68b!important}.bad{border-color:#ff687b!important}.feedback{margin-top:14px;padding:12px;border-radius:11px;background:#0e172a}.stats{display:flex;justify-content:space-between;color:#aab9d4;font-size:13px;margin-top:7px}@media(max-width:600px){.row{grid-template-columns:1fr}.btn,select{min-height:44px}.tile{font-size:16px}}
</style></head><body><div class="wrap"><div class="top"><div class="bar"><i id="bar"></i></div><div class="stats"><span id="pos">Ready</span><span id="score">Score 0%</span></div></div>
<section id="start" class="card start"><div class="pill">PMP 2026 • 110 questions</div><h1>PMP Drag & Drop Practice</h1><p class="muted">Tap Start Practice. On iPhone, tap an answer and then tap its destination. Your progress is saved in Safari.</p><button id="startBtn" class="btn primary big">Start Practice</button></section>
<section id="app" class="hidden"><div class="controls"><button id="shuffle" class="btn">Shuffle</button><button id="missed" class="btn">Missed Only</button><select id="domain"><option value="all">All domains</option><option>People</option><option>Process</option><option>Business Environment</option></select></div><div class="card"><div class="meta"><span id="qn" class="pill"></span><span id="dom" class="pill"></span><span id="typ" class="pill"></span></div><h2 id="title"></h2><p id="prompt" class="muted"></p><div id="work"></div><div class="actions"><button id="check" class="btn primary">Check Answer</button><button id="reset" class="btn">Reset</button><button id="prev" class="btn">←</button><button id="next" class="btn">→</button></div><div id="fb"></div></div></section></div>
<script src="data1.js"></script><script src="data2.js"></script><script src="data3.js"></script><script src="data4.js"></script><script src="data5.js"></script><script src="data6.js"></script><script>
const Q=window.PMP_QUESTIONS||[],S={i:0,sel:null,p:{},mode:'all',domain:'all',order:Q.map(x=>x.id),r:JSON.parse(localStorage.getItem('pmpR')||'{}')},$=x=>document.getElementById(x),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ids(){let a=Q.filter(q=>(S.domain==='all'||q.domain===S.domain)&&(S.mode!=='missed'||S.r[q.id]?.correct===false)).map(q=>q.id),m=new Map(S.order.map((x,i)=>[x,i]));return a.sort((a,b)=>m.get(a)-m.get(b))}function cq(){let a=ids();if(!a.length)return null;S.i=Math.max(0,Math.min(S.i,a.length-1));return Q.find(q=>q.id===a[S.i])}function clear(){S.sel=null;S.p={}}function text(q,k){let n=+k.slice(1);return q.type==='match'?q.pairs[n].right:q.type==='sequence'?q.items[n]:q.items[n].text}function placed(k){return Object.entries(S.p).find(([d,v])=>Array.isArray(v)?v.includes(k):v===k)?.[0]}function del(k){for(let d in S.p){let v=S.p[d];if(Array.isArray(v))S.p[d]=v.filter(x=>x!==k);else if(v===k)delete S.p[d]}}function tile(k,t){return `<div class="tile${S.sel===k?' sel':''}" draggable="true" data-k="${k}">${esc(t)}</div>`}
function bind(){document.querySelectorAll('.tile').forEach(e=>{e.onclick=x=>{x.stopPropagation();let k=e.dataset.k;if(placed(k)){del(k);S.sel=null;draw()}else{S.sel=S.sel===k?null:k;draw()}};e.ondragstart=x=>x.dataTransfer.setData('text/plain',e.dataset.k)});document.querySelectorAll('[data-d]').forEach(e=>{e.ondragover=x=>x.preventDefault();e.ondrop=x=>{x.preventDefault();put(x.dataTransfer.getData('text/plain'),e.dataset.d)};e.onclick=()=>S.sel&&put(S.sel,e.dataset.d)})}function put(k,d){let q=cq();if(!k)return;del(k);if(q.type==='categorize')(S.p[d]||(S.p[d]=[])).push(k);else S.p[d]=k;S.sel=null;draw()}
function draw(){let q=cq(),w=$('work');if(!q){w.innerHTML='<p>No missed questions yet.</p>';return}let used=new Set(Object.values(S.p).flat()),bank=[];if(q.type==='match')q.pairs.forEach((x,i)=>!used.has('p'+i)&&bank.push(tile('p'+i,x.right)));if(q.type==='sequence')q.items.forEach((x,i)=>!used.has('s'+i)&&bank.push(tile('s'+i,x)));if(q.type==='categorize')q.items.forEach((x,i)=>!used.has('c'+i)&&bank.push(tile('c'+i,x.text)));let h='<div class="bank">'+bank.join('')+'</div>';if(q.type==='match')q.pairs.forEach((x,i)=>{let k=S.p['d'+i];h+=`<div class="row"><div class="label">${esc(x.left)}</div><div class="drop" data-d="d${i}">${k?tile(k,text(q,k)):'Tap here'}</div></div>`});if(q.type==='sequence')q.items.forEach((x,i)=>{let k=S.p['d'+i];h+=`<div class="row"><div class="label">${i+1}</div><div class="drop" data-d="d${i}">${k?tile(k,text(q,k)):'Tap here'}</div></div>`});if(q.type==='categorize')q.buckets.forEach((b,i)=>{let ks=S.p['b'+i]||[];h+=`<div class="bucket" data-d="b${i}"><b>${esc(b)}</b>${ks.map(k=>tile(k,text(q,k))).join('')}</div>`});w.innerHTML=h;bind();$('qn').textContent='Q'+q.id;$('dom').textContent=q.domain;$('typ').textContent=q.type.toUpperCase();$('title').textContent=q.title;$('prompt').textContent=q.prompt;let a=ids();$('pos').textContent=`${S.i+1} of ${a.length}`;$('bar').style.width=((S.i+1)/a.length*100)+'%';stats()}
function check(){let q=cq(),ok=true,full=true;if(q.type==='match')q.pairs.forEach((x,i)=>{if(!S.p['d'+i])full=false;if(S.p['d'+i]!=='p'+i)ok=false});if(q.type==='sequence')q.items.forEach((x,i)=>{if(!S.p['d'+i])full=false;if(S.p['d'+i]!=='s'+i)ok=false});if(q.type==='categorize'){full=Object.values(S.p).flat().length===q.items.length;q.items.forEach((x,i)=>{let b=q.buckets.indexOf(x.bucket);if(!(S.p['b'+b]||[]).includes('c'+i))ok=false})}if(!full){$('fb').innerHTML='<div class="feedback bad">Place every answer first.</div>';return}S.r[q.id]={correct:ok};localStorage.setItem('pmpR',JSON.stringify(S.r));$('fb').innerHTML=`<div class="feedback ${ok?'ok':'bad'}"><b>${ok?'Correct':'Not quite'}</b><br>${esc(q.explanation)}</div>`;stats()}
function stats(){let v=Object.values(S.r),c=v.filter(x=>x.correct).length;$('score').textContent='Score '+(v.length?Math.round(c/v.length*100):0)+'%'}function nav(n){S.i+=n;clear();$('fb').innerHTML='';draw()}$('startBtn').onclick=()=>{$('start').classList.add('hidden');$('app').classList.remove('hidden');draw()};$('check').onclick=check;$('reset').onclick=()=>{clear();$('fb').innerHTML='';draw()};$('prev').onclick=()=>nav(-1);$('next').onclick=()=>nav(1);$('domain').onchange=e=>{S.domain=e.target.value;S.i=0;clear();draw()};$('missed').onclick=()=>{S.mode=S.mode==='missed'?'all':'missed';S.i=0;clear();draw()};$('shuffle').onclick=()=>{S.order.sort(()=>Math.random()-.5);S.i=0;clear();draw()};
</script></body></html>
